<script>window.DC_TEMPLATE = "\u003cdiv style=\"min-height: 100vh; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 22px 16px; box-sizing: border-box; overflow-x: auto\">\n\n\u003cdiv class=\"cap\">\u003cstrong>Prévia de impressão · A4 paisagem · preto e branco · 1 leito por folha\u003c/strong>\u003cspan>Só o que foi preenchido. Sem botões, sem cores e sem áreas pintadas, para economizar tinta. Leito com protocolo de ME aberto ganha uma seção própria abaixo da identificação.\u003c/span>\u003c/div>\n\n\u003cdiv class=\"sheet\" role=\"img\" aria-label=\"Folha impressa do leito 04\">\n\u003cdiv class=\"top\">\n\u003cdiv>\u003cb>Hospital das Couves · CTI 1 Neurológico · Posto 1\u003c/b>\u003cbr>\u003cspan>Round de terça, 27/10/2026 · impresso às 08:30 por Ana Costa (plantonista)\u003c/span>\u003c/div>\n\u003cspan style=\"text-align: right\">Documento interno com dados sensíveis.\u003cbr>Descartar em fragmentadora.\u003c/span>\n\u003c/div>\n\n\u003cdiv class=\"idrow\">\n\u003cdiv class=\"leito\">\u003csmall>LEITO\u003c/small>\u003cb>04\u003c/b>\u003c/div>\n\u003cdiv class=\"idt\">\u003cb>JOÃO DA SILVA\u003c/b>\u003cbr>58 anos · DN 14/03/1968 · Pront. 123456\u003cbr>Internação e CTI: 20/10 · \u003cspan class=\"mk\">D7 no CTI\u003c/span> · 72 kg (real) · 1,70 m\u003cbr>Neurocirurgia · antes da internação: independente\u003c/div>\n\u003cdiv class=\"al\">\n\u003cdiv class=\"a1 crit\">\u003csvg width=\"11\" height=\"11\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z\"/>\u003cpath d=\"M12 9v4\"/>\u003cpath d=\"M12 17h.01\"/>\u003c/svg>ALERGIA: DIPIRONA (urticária)\u003c/div>\n\u003cdiv class=\"a1\">ISOLAMENTO: CONTATO (MRSA) + RESPIRATÓRIO (TB em investigação)\u003c/div>\n\u003cdiv class=\"a1\" style=\"font-weight: 600\">Nível de suporte: pleno (família, 21/10)\u003c/div>\n\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"cols\">\n\u003cdiv class=\"col\">\n\u003cdiv class=\"s\">\u003ch3>Diagnósticos\u003c/h3>\n\u003cp>1. HSA aneurismática (AComA), ictus 20/10 · D7 pós-ictus\u003c/p>\n\u003cp>2. PO embolização de aneurisma (21/10) · PO D6\u003c/p>\n\u003cp>3. PO DVE frontal D (20/10) · PO D7\u003c/p>\n\u003cp>4. Pneumonia associada à ventilação (25/10)\u003c/p>\n\u003cp>Comorbidades: HAS, tabagismo\u003c/p>\n\u003cp>Uso contínuo: losartana (suspensa), sinvastatina (mantida)\u003c/p>\n\u003c/div>\n\u003cdiv class=\"s\">\u003ch3>Neurológico · exame das 06:40\u003c/h3>\n\u003cp>ECG 8T · RASS −2 (meta 0 a −2) · pupilas isocóricas 3 mm, FR+\u003c/p>\n\u003cp>Hemiparesia E grau 3 · Hunt-Hess 3 · WFNS 4 · Fisher mod. 3\u003c/p>\n\u003cp>PIC 8–14 · PPC 78 · DVE 15 cmH₂O, 180 ml/24 h\u003c/p>\n\u003cp>Nimodipino dia 7 de 21 · levetiracetam desde 20/10\u003c/p>\n\u003cp>Alvos: PAS &lt; 160 · PPC &gt; 60 · Na 140–150 · Tax &lt; 37,5\u003c/p>\n\u003cp>Última TC 25/10: sem novo sangramento, sem hidrocefalia\u003c/p>\n\u003cp>Neurocirurgia: em acompanhamento desde 20/10\u003c/p>\n\u003c/div>\n\u003cdiv class=\"s\">\u003ch3>Dispositivos\u003c/h3>\n\u003cp>D7 (D0 20/10 · Emergência) TOT\u003c/p>\n\u003cp>D7 (D0 20/10 · CC) PVP VJID\u003c/p>\n\u003cp>D6 (D0 21/10 · CTI) PAI radial E\u003c/p>\n\u003cp>D7 (D0 20/10 · CC) DVE frontal D\u003c/p>\n\u003cp class=\"mk\">▲ D7 (D0 20/10 · CC) CVD · rever\u003c/p>\n\u003cp>D6 (D0 21/10 · CTI) SNE · D1 (D0 26/10 · CTI) AVP\u003c/p>\n\u003c/div>\n\u003cdiv class=\"s\">\u003ch3>Família\u003c/h3>\n\u003cp>26/10, esposa: gravidade e possibilidade de TQT\u003c/p>\n\u003c/div>\n\u003cdiv class=\"s\" style=\"display: flex; flex-direction: column; flex: 1\">\u003ch3>Anotações do plantão\u003c/h3>\u003cdiv class=\"lines\">\u003c/div>\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"col\">\n\u003cdiv class=\"s\">\u003ch3>Infusões · vazão (dose)\u003c/h3>\n\u003cp>Noradrenalina 3 ml/h (0,14 mcg/kg/min)\u003c/p>\n\u003cp>Fentanil 2 ml/h (100 mcg/h · 1,39 mcg/kg/h)\u003c/p>\n\u003cp>Midazolam 2 ml/h (10 mg/h · 0,14 mg/kg/h)\u003c/p>\n\u003cp>Dexmedetomidina 4 ml/h (0,22 mcg/kg/h) · NaCl 3% 21 ml/h\u003c/p>\n\u003c/div>\n\u003cdiv class=\"s\">\u003ch3>Respiratório · D7 de VM\u003c/h3>\n\u003cp>TOT + VM · PCV · Pinsp 14 · PEEP 8 · FiO₂ 35% · FR 18 · VC 450\u003c/p>\n\u003cp>Gasometria 26/10 &gt; 27/10:\u003c/p>\n\u003cdiv class=\"g3\">\u003cspan>pH 7,41 &gt; 7,44\u003c/span>\u003cspan>pCO₂ 38 &gt; 35\u003c/span>\u003cspan>pO₂ 92 &gt; 104\u003c/span>\u003cspan>HCO₃ 24,1 &gt; 23,8\u003c/span>\u003cspan>Lact 1,4 &gt; 1,1\u003c/span>\u003cspan>P/F 263 &gt; 297\u003c/span>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"s\">\u003ch3>Últimas 24 h\u003c/h3>\n\u003cp>Tax máx 37,8 (1 pico) · PAS 118–152 · PAD 60–88 · FC 72–98\u003c/p>\n\u003cp>FR 16–20 · SatO₂ 95–99% · glicemia 132–178 (6 UI) · sem dor\u003c/p>\n\u003cp>Ganhos 2.900 &gt; 2.920 · perdas 2.160 &gt; 2.280 ml\u003c/p>\n\u003cp>Diurese 2.100 ml (1,2 ml/kg/h) · \u003cspan class=\"mk\">BH +740 &gt; +640\u003c/span> · acum. +2.850\u003c/p>\n\u003c/div>\n\u003cdiv class=\"s\">\u003ch3>Infecção\u003c/h3>\n\u003cp class=\"mk\">D2 (D0 25/10) cefepime\u003c/p>\n\u003cp>Prévio: cefazolina 20 a 21/10\u003c/p>\n\u003cp>Sec. traqueal 25/10: K. pneumoniae, sensível a cefepime\u003c/p>\n\u003cp>Hemoculturas 25/10: parcial, sem crescimento em 48 h\u003c/p>\n\u003cp>Urocultura e líquor 25/10: negativos · swab 22/10: MRSA\u003c/p>\n\u003cp>TB: GeneXpert 26/10 não detectado · BAAR 1 negativa · BAAR 2 pendente\u003c/p>\n\u003cp>Sepse: 25/10 14:20, pulmonar, em tratamento · 22/10, ventriculite, descartada\u003c/p>\n\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"col\">\n\u003cdiv class=\"s\">\u003ch3>Laboratório 26/10 &gt; 27/10\u003c/h3>\n\u003cdiv class=\"g3\">\u003cspan>Hb 9,8 &gt; 9,4\u003c/span>\u003cspan>Leuc 14.200 &gt; 12.800\u003c/span>\u003cspan>Plaq 210 &gt; 228 mil\u003c/span>\u003cspan>PCR 18,4 &gt; 12,1\u003c/span>\u003cspan>INR 1,1 &gt; 1,1\u003c/span>\u003cspan>Glic 156 &gt; 142\u003c/span>\u003cspan>Na 144 &gt; 147\u003c/span>\u003cspan>K 3,8 &gt; 3,4\u003c/span>\u003cspan>Mg 1,9 &gt; 2,0\u003c/span>\u003cspan>Ur 32 &gt; 30\u003c/span>\u003cspan>Cr 0,82 &gt; 0,79\u003c/span>\u003cspan>TFG 102 &gt; 103\u003c/span>\u003cspan>Osm 298 &gt; 302\u003c/span>\u003c/div>\n\u003c/div>\n\u003cdiv class=\"s\">\u003ch3>Imagens\u003c/h3>\n\u003cp>DTC 26/10: VM ACM D 118 cm/s, Lindegaard 2,4, vasoespasmo leve\u003c/p>\n\u003cp>TC 25/10: sem novo sangramento · RX 25/10: consolidação base D\u003c/p>\n\u003cp>Pedido: angio-TC de crânio (27/10)\u003c/p>\n\u003c/div>\n\u003cdiv class=\"s\">\u003ch3>Profilaxias\u003c/h3>\n\u003cp>TEV mecânica · LAMG: omeprazol 40 mg/dia\u003c/p>\n\u003c/div>\n\u003cdiv class=\"s\">\u003ch3>Nutrição e TGI\u003c/h3>\n\u003cp>Enteral 50 ml/h, 100% da meta · sem distensão · última evacuação 26/10\u003c/p>\n\u003c/div>\n\u003cdiv class=\"s\">\u003ch3>Pele\u003c/h3>\n\u003cp>Sem lesão por pressão · Braden 12\u003c/p>\n\u003c/div>\n\u003cdiv class=\"s\">\u003ch3>Plano do dia\u003c/h3>\n\u003cp>Neuro: PAS &lt; 160 e PPC &gt; 60 / DTC hoje / nimodipino dia 7 de 21\u003c/p>\n\u003cp>Respiratório: manter PCV / reavaliar TRE em 24 h\u003c/p>\n\u003cp>Infecção: cefepime D2 de 7 / aguardar hemoculturas e BAAR 2\u003c/p>\n\u003cp>Metabólico: manter NaCl 3% / Na alvo 140–150 / repor K\u003c/p>\n\u003cp>Nutrição: manter enteral plena\u003c/p>\n\u003c/div>\n\u003cdiv class=\"s\">\u003ch3>Pendências\u003c/h3>\n\u003cp>\u003cspan class=\"box\">\u003c/span>Angio-TC de crânio de controle (rotina)\u003c/p>\n\u003cp>\u003cspan class=\"box\">\u003c/span>Parecer da neurocirurgia sobre tempo de DVE (plantonista)\u003c/p>\n\u003c/div>\n\u003c/div>\n\u003c/div>\n\n\u003cdiv class=\"foot\">\u003cspan>Folha 4 de 9 · Posto 1 · 27/10/2026\u003c/span>\u003cspan>Gerado pelo CriticalEye · confira no prontuário\u003c/span>\u003c/div>\n\u003c/div>\n\n\u003c/div>";</script>
