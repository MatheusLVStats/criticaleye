tion>\n\u003c/div>\n\n\u003cdiv class=\"col\">\n\u003csection class=\"card\">\n\u003cdiv class=\"ch\">\u003ch2 class=\"ct\">Parecer\u003c/h2>\u003cspan class=\"lbl\">interconsulta · leito 05\u003c/span>\u003c/div>\n\u003cdiv class=\"doc\">\n\u003cdiv class=\"t\">PARECER\u003c/div>\n\u003cdiv class=\"dg\">\n\u003cdiv>\u003cspan>Especialidade solicitante\u003c/span>\u003cb>CTI 1 · ROTINA\u003c/b>\u003c/div>\n\u003cdiv>\u003cspan>Data da solicitação\u003c/span>\u003cb>\u003cmark>24/10/2026 10:15\u003c/mark>\u003c/b>\u003c/div>\n\u003cdiv style=\"grid-column: span 2\">\u003cspan>Motivo\u003c/span>\u003cb>AVCi maligno, prognóstico neurológico reservado. Solicito avaliação da comissão de cuidados paliativos.\u003c/b>\u003c/div>\n\u003cdiv>\u003cspan>Especialidade resposta\u003c/span>\u003cb>\u003cmark>CUIDADOS PALIATIVOS\u003c/mark>\u003c/b>\u003c/div>\n\u003cdiv>\u003cspan>Data de resposta\u003c/span>\u003cb>\u003cmark>25/10/2026 14:40\u003c/mark>\u003c/b>\u003c/div>\n\u003c/div>\n\u003cp>\u003cmark>Paciente elegível para acompanhamento pela especialidade.\u003c/mark> Acompanharemos em conjunto com a equipe assistente. \u003cmark>Solicito agendamento de conferência familiar pelo Serviço Social.\u003c/mark>\u003c/p>\n\u003c/div>\n\u003cdiv class=\"arrow\">Entra em Cuidados paliativos\u003c/div>\n\u003cdiv class=\"res\">\u003cspan class=\"k\">Comissão de CP\u003c/span>\u003cspan>Pedido em 24/10 · respondido em 25/10 · elegível, acompanhamento em conjunto\u003c/span>\u003c/div>\n\u003cdiv class=\"res\">\u003cspan class=\"k\">Nova pendência\u003c/span>\u003cspan>Conferência familiar, agendar pelo Serviço Social\u003c/span>\u003c/div>\n\u003cdiv class=\"rule\">A especialidade da resposta decide para onde vai. Parecer da \u003cstrong>neurocirurgia\u003c/strong> preenche o campo Neurocirurgia do Neurológico (em acompanhamento ou conduta conservadora, com a data da resposta). Parecer pedido e ainda sem resposta vira a pendência \"aguardando parecer\". Os demais entram numa linha
