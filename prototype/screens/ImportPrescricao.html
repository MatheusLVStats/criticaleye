cdiv>\u003cspan>Idade · peso\u003c/span>\u003cb>68 · \u003cmark>78\u003c/mark>\u003c/b>\u003c/div>\n\u003cdiv>\u003cspan>Prontuário\u003c/span>\u003cb>215338\u003c/b>\u003c/div>\n\u003cdiv style=\"grid-column: span 2\">\u003cspan>Enfermaria / leito\u003c/span>\u003cb>CTI 2 / LEITO 6\u003c/b>\u003c/div>\n\u003cdiv style=\"grid-column: span 2\">\u003cspan>Validade\u003c/span>\u003cb>\u003cmark>27/10/2026 19:00 a 28/10/2026 18:59\u003c/mark>\u003c/b>\u003c/div>\n\u003c/div>\n\u003cp style=\"margin: 0\">\u003cb>Alergias:\u003c/b> \u003cmark>Paciente nega alergias\u003c/mark>\u003c/p>\n\u003ctable class=\"pt\">\n\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>Medicamento\u003c/th>\u003cth>Dose\u003c/th>\u003cth>Orientação\u003c/th>\u003cth>Via\u003c/th>\u003cth>Posologia\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>A\u003c/td>\u003ctd>\u003cmark>DIETA ZERO\u003c/mark>\u003c/td>\u003ctd>\u003c/td>\u003ctd>Jejum\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>B\u003c/td>\u003ctd>\u003cmark>NORADRENALINA 20 ML + SG5% 80 ML\u003c/mark> EM BI\u003c/td>\u003ctd>20 ml\u003c/td>\u003ctd>\u003c/td>\u003ctd>EV\u003c/td>\u003ctd>Contínuo\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>C\u003c/td>\u003ctd>\u003cmark>FENTANILA 60 ML SEM DILUIÇÃO\u003c/mark> EM BI\u003c/td>\u003ctd>60 ml\u003c/td>\u003ctd>\u003c/td>\u003ctd>EV\u003c/td>\u003ctd>Contínuo\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>D\u003c/td>\u003ctd>\u003cmark>PROPOFOL 1% 100 ML SEM DILUIÇÃO\u003c/mark> EM BI\u003c/td>\u003ctd>100 ml\u003c/td>\u003ctd>\u003c/td>\u003ctd>EV\u003c/td>\u003ctd>Contínuo\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>E\u003c/td>\u003ctd>\u003cmark>PIPERACILINA + TAZOBACTAM\u003c/mark> 4 G + 0,5 G · \u003cmark>D (2 / 7)\u003c/mark>\u003c/td>\u003ctd>4,5 g\u003c/td>\u003ctd>Justificativa: \u003cmark>peritonite fecal\u003c/mark>\u003c/td>\u003ctd>EV\u003c/td>\u003ctd>6/6h\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>F\u003c/td>\u003ctd>\u003cmark>HIDROCORTISONA\u003c/mark> SUCCINATO 100 MG\u003c/td>\u003ctd>50 mg\u003c/td>\u003ctd>\u003c/td>\u003ctd>EV\u003c/td>\u003ctd>6/6h\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>G\u003c/td>\u003ctd>\u003cmark>ENOXAPARINA 40 MG\u003c/mark> SERINGA PREENCHIDA\u003c/td>\u003ctd>40 mg\u003c/td>\u003ctd>\u003c/td>\u003ctd>SC\u003c/td>\u003ctd>24/24h\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>H\u003c/td>\u003ctd>\u003cmark>OMEPRAZOL 40 MG\u003c/mark> P/ SOL. INJ.\u003c/td>\u003ctd>40 mg\u003c/td>\u003ctd>\u003c/td>\u003ctd>EV\u003c/td>\u003ctd>24/24h\u003c/td>\u003c/tr>\n\u003ctr class=\"dim\">\u003ctd>I\u003c/td>\u003ctd>DIPIRONA SÓDICA 500 MG/ML\u003c/td>\u003ctd>1 g\u003c/td>\u003ctd>\u003c/td>\u003ctd>IV\u003c/td>\u003ctd>6/6h\u003c/td>\u003c/tr>\n\u003ctr class=\"dim\">\u003ctd>J\u003c/td>\u003ctd>ONDANSETRONA 2 MG/ML\u003c/td>\u003ctd>8 mg\u003c/td>\u003ctd>Se náusea\u003c/td>\u003ctd>EV\u003c/td>\u003ctd>8/8h SOS\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>K\u003c/td>\u003ctd>\u003cmark>HGT\u003c/mark> HEMOGLICOTESTE\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003cmark>4/4h, insulina regular conforme esquema\u003c/mark>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr class=\"dim\">\u003ctd>L\u003c/td>\u003ctd>CUIDADOS GERAIS\u003c/td>\u003ctd>\u003c/td>\u003ctd>Cabeceira elevada 30°\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr class=\"dim\">\u003ctd>M\u003c/td>\u003ctd>SINAIS VITAIS\u003c/td>\u003ctd>\u003c/td>\u003ctd>1/1h\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003c/div>\n\u003cspan class=\"lbl\">Em verde, o que o app reconheceu. Em cinza, o que fica só no PDF.\u003c/span>\n\u003c/section>\n\n\u003csection class=\"card\" style=\"flex: 5 1 440px\">\n\u003cdiv class=\"ch\">\u003ch2 class=\"ct\">O que o app encontrou\u003c/h2>\u003cspan class=\"lbl\">confira e descarte o que não servir\u003c/span>\u003c/div>\n\n\u003ch3 class=\"sub\">Identificação \u003cspan class=\"to\">→ Peso e alertas\u003c/span>\u003c/h3>\n\u003cdiv class=\"it\">\u003cspan class=\"k\">Peso\u003c/span>\u003cspan class=\"v\">78 kg \u003cspan class=\"lbl\">· usado no cálculo das doses\u003c/span>\u003c/span>\u003cbutton class=\"x\" aria-label=\"Descartar peso\">\u003csvg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M18 6L6 18M6 6l12 12\"/>\u003c/svg>\u003c/button>\u003c/div>\n\u003cdiv class=\"it\">\u003cspan class=\"k\">Alergias\u003c/span>\u003cspan class=\"v\">Nega alergias \u003cspan class=\"lbl\">· confirme com paciente ou família\u003c/span>\u003c/span>\u003cbutton class=\"x\" aria-label=\"Descartar alergias\">\u003csvg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M18 6L6 18M6 6l12 12\"/>\u003c/svg>\u003c/button>\u003c/div>\n\n\u003ch3 class=\"sub\">Antimicrobiano \u003cspan class=\"to\">→ Infecção\u003c/span>\u003c/h3>\n\u003cdiv class=\"it\">\u003cspan class=\"k\">Piperacilina-tazobactam\u003c/span>\u003cspan class=\"v\">D1 (D0 27/10) · foco: peritonite fecal · previsto 7 dias\u003cbr>\u003cspan class=\"lbl\">Na prescrição: D (2 / 7). Se a 1ª dose foi feita antes da prescrição, como dose imediata ou de ataque, corrija o D0.\u003c/span>\u003cspan class=\"d0\">\u003clabel for=\"p-d0\">D0\u003c/label>\u003cinput id=\"p-d0\" class=\"in\" value=\"27/10/2026\">\u003c/span>\u003c/span>\u003cbutton class=\"x\" aria-label=\"Descartar antimicrobiano\">\u003csvg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M18 6L6 18M6 6l12 12\"/>\u003c/svg>\u003c/button>\u003c/div>\n\n\u003ch3 class=\"sub\">Infusões contínuas \u003cspan class=\"to\">→ Hemodinâmica e infusões\u003c/span>\u003c/h3>\n\u003cdiv class=\"it\">\u003cspan class=\"k\">Noradrenalina\u003c/span>\u003cspan class=\"v\">20 ml + SG5% 80 ml = 200 mcg/ml \u003cspan class=\"ok\">padrão da unidade\u003c/span>\u003c/span>\u003cbutton class=\"x\" aria-label=\"Descartar noradrenalina\">\u003csvg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M18 6L6 18M6 6l12 12\"/>\u003c/svg>\u003c/button>\u003c/div>\n\u003cdiv class=\"it\">\u003cspan class=\"k\">Fentanil\u003c/span>\u003cspan class=\"v\">Sem diluição = 50 mcg/ml \u003cspan class=\"ok\">padrão da unidade\u003c/span>\u003c/span>\u003cbutton class=\"x\" aria-label=\"Descartar fentanil\">\u003csvg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M18 6L6 18M6 6l12 12\"/>\u003c/svg>\u003c/button>\u003c/div>\n\u003cdiv class=\"it\">\u003cspan class=\"k\">Propofol\u003c/span>\u003cspan class=\"v\">1% sem diluição = 10 mg/ml \u003cspan class=\"ok\">padrão da unidade\u003c/span>\u003c/span>\u003cbutton class=\"x\" aria-label=\"Descartar propofol\">\u003csvg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M18 6L6 18M6 6l12 12\"/>\u003c/svg>\u003c/button>\u003c/div>\n\u003cdiv class=\"it\">\u003cspan class=\"k\">Corticoide\u003c/span>\u003cspan class=\"v\">Hidrocortisona 50 mg 6/6h\u003c/span>\u003cbutton class=\"x\" aria-label=\"Descartar corticoide\">\u003csvg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M18 6L6 18M6 6l12 12\"/>\u003c/svg>\u003c/button>\u003c/div>\n\u003cspan class=\"lbl\">A prescrição não traz a vazão: ela é digitada no leito, como está na bomba, e o app calcula a dose.\u003c/span>\n\n\u003ch3 class=\"sub\">Profilaxias, nutrição e glicemia\u003c/h3>\n\u003cdiv class=\"it\">\u003cspan class=\"k\">TEV\u003c/span>\u003cspan class=\"v\">Enoxaparina 40 mg SC 1x/dia\u003c/span>\u003cbutton class=\"x\" aria-label=\"Descartar profilaxia de TEV\">\u003csvg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M18 6L6 18M6 6l12 12\"/>\u003c/svg>\u003c/button>\u003c/div>\n\u003cdiv class=\"it\">\u003cspan class=\"k\">LAMG\u003c/span>\u003cspan class=\"v\">Omeprazol 40 mg EV 1x/dia\u003c/span>\u003cbutton class=\"x\" aria-label=\"Descartar profilaxia de LAMG\">\u003csvg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M18 6L6 18M6 6l12 12\"/>\u003c/svg>\u003c/button>\u003c/div>\n\u003cdiv class=\"it\">\u003cspan class=\"k\">Dieta\u003c/span>\u003cspan class=\"v\">Zero\u003c/span>\u003cbutton class=\"x\" aria-label=\"Descartar dieta\">\u003csvg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M18 6L6 18M6 6l12 12\"/>\u003c/svg>\u003c/button>\u003c/div>\n\u003cdiv class=\"it\">\u003cspan class=\"k\">Glicemia\u003c/span>\u003cspan class=\"v\">HGT 4/4h · insulina regular conforme esquema\u003c/span>\u003cbutton class=\"x\" aria-label=\"Descartar glicemia\">\u003csvg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M18 6L6 18M6 6l12 12\"/>\u003c/svg>\u003c/button>\u003c/div>\n\n\u003cdiv class=\"off\">\n\u003cspan>Fica só no PDF. Marque se quiser levar como observação:\u003c/span>\n\u003clabel class=\"ck\">\u003cinput type=\"checkbox\">Dipirona 1 g 6/6h\u003c/label>\n\u003clabel class=\"ck\">\u003cinput type=\"checkbox\">Ondansetrona 8 mg 8/8h, se náusea\u003c/label>\n\u003cspan>Cuidados gerais e sinais vitais não entram no round.\u003c/span>\n\u003c/div>\n\u003c/section>\n\n\u003c/div>\n\n\u003cdiv style=\"display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap\">\n\u003cspan class=\"lbl\">Na importação seguinte, o app só mostra o que mudou. O D0 conferido fica no round: se a prescrição de outro dia contar diferente, o app só avisa.\u003c/span>\n\u003cdiv style=\"display: flex; gap: 8px\">\n\u003cbutton class=\"btn\">Cancelar\u003c/button>\n\u003cbutton class=\"btn p\">Levar para o round do Leito 06\u003c/button>\n\u003c/div>\n\u003c/div>\n\n\u003c/main>\n\u003c/div>";</script>
