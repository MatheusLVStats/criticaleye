<script>
class Component extends DCLogic {

  renderVals() {
    const s = this.state;
    const cadastro = { '521234567': 'Ana Costa', '529876543': 'Bruno Lima', '5245210': 'Carlos Moura' };
    const id = String(s.crm || '').replace(/\D/g, '');

    const postoTxt = s.posto === 'p1' ? 'Posto 1' : s.posto === 'p2' ? 'Posto 2' : '';
    return {
      hospital: this.props.hospital ?? 'Hospital das Couves',
      crm: s.crm,
      nome: nome,
      conhecido: conhecido,
      desconhecido: desconhecido,
      ehAdm: ehAdm,
      ehMedico: !ehAdm,
      prim: s.prim,
      onCrm: (e) => this.setState({ crm: e.target.value, tentou: false }),
      conferir: () => this.setState({ tentou: true }),
      limpar: () => this.setState({ crm: '', papel: '' }),

      ehP1: s.posto === 'p1', ehP2: s.posto === 'p2',

      setP1: () => this.setState({ posto: 'p1' }),
      setP2: () => this.setState({ posto: 'p2' }),
      clsEntrar: pronto ? 'btn' : 'btn off',
