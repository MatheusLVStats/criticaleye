>\n\u003cdiv class=\"dh\">Diagnóstico e procedimento\u003c/div>\n\u003cp>\u003cmark>K63.1 - Perfuração do intestino (não traumática)\u003c/mark>\u003c/p>\n\u003cp>0407040161 - \u003cmark>LAPAROTOMIA EXPLORADORA\u003c/mark>\u003c/p>\n\u003cdiv class=\"dg\">\n\u003cdiv>\u003cspan>Início\u003c/span>\u003cb>\u003cmark>27/10/26 21:40\u003c/mark>\u003c/b>\u003c/div>\n\u003cdiv>\u003cspan>Fim\u003c/span>\u003cb>27/10/26 23:35\u003c/b>\u003c/div>\n\u003cdiv>\u003cspan>Especialidade\u003c/span>\u003cb>\u003cmark>CIRURGIA GERAL\u003c/mark>\u003c/b>\u003c/div>\n\u003c/div>\n\u003cp>\u003cspan style=\"font-size: 10px; color: #7A8A90; text-transform: uppercase\">Cirurgião\u003c/span> \u003cb>\u003cmark>HENRIQUE TAVARES\u003c/mark>\u003c/b> · \u003cspan style=\"font-size: 10px; color: #7A8A90; text-transform: uppercase\">1º auxiliar\u003c/span> LÍVIA MARTINS\u003c/p>\n\u003cdiv class=\"dh\">Descrição da cirurgia\u003c/div>\n\u003col>\n\u003cli>Assepsia, antissepsia e colocação de campos estéreis\u003c/li>\n\u003cli>Laparotomia mediana supra e infraumbilical\u003c/li>\n\u003cli>Ao inventário: peritonite fecal em andar inferior, \u003cmark>perfuração de cólon sigmoide\u003c/mark> de cerca de 1 cm\u003c/li>\n\u003cli>\u003cmark>Coletado líquido peritoneal para cultura\u003c/mark>\u003c/li>\n\u003cli>\u003cmark>Retossigmoidectomia à Hartmann com colostomia terminal em FIE\u003c/mark>\u003c/li>\n\u003cli>Lavagem exaustiva da cavidade com SF 0,9% morno\u003c/li>\n\u003cli>\u003cmark>Drenagem da pelve com dreno tubular exteriorizado em FID\u003c/mark>\u003c/li>\n\u003cli>\u003cmark>Instabilidade hemodinâmica, iniciada noradrenalina na sala\u003c/mark>\u003c/li>\n\u003cli>Síntese da aponeurose e da pele · curativo\u003c/li>\n\u003c/ol>\n\u003c/div>\n\u003cspan class=\"lbl\">Em verde, o que o app reconheceu. CPF, CNS e nome da mãe são ignorados: o app não guarda. O arquivo é apagado da pasta de entrada assim que os dados vão para o round.\u003c/span>\n\u003c/section>\n\n\u003csection clas M6 6l12 12\"/>\u003c/svg>\u003c/button>\u003c/div>\n\u003cdiv class=\"it\">\u003cspan class=\"k\">Ostomia\u003c/span>\u003cspan class=\"v\">D1 (D0 27/10 - CC) Colostomia terminal · FIE\u003c/span>\u003cbutton class=\"x\" aria-label=\"Descartar ostomia\">\u003csvg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M18 6L6 18M6 6l12 12\"/>\u003c/svg>\u003c/button>\u003c/div>\n\n\u003ch3 class=\"sub\">Infecção e pendências \u003cspan class=\"to\">→ Culturas e Pendências\u003c/span>\u003c/h3>\n\u003cdiv class=\"it\">\u003cspan class=\"k\">Cultura\u003c/span>\u003cspan class=\"v\">Líquido peritoneal · colhido no CC em 27/10 · aguardando\u003c/span>\u003cbutton class=\"x\" aria-label=\"Descartar cultura\">\u003csvg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M18 6L6 18M6 6l12 12\"/>\u003c/svg>\u003c/button>\u003c/div>\n\u003cdiv class=\"it\">\u003cspan class=\"k\">Pendência\u003c/span>\u003cspan class=\"v\">Resultado do histopatológico (enviado no CC)\u003c/span>\u003cbutton class=\"x\" aria-label=\"Descartar pendência\">\u003csvg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M18 6L6 18M6 6l12 12\"/>\u003c/svg>\u003c/button>\u003c/div>\n\n\u003cdiv class=\"off\">O resto da descrição fica no PDF e pode ir para \"História\". Em cirurgia vascular, o app também liga o bloco vascular quando lê revascularização ou reconstrução arterial e avisa se houve fasciotomia. Se o relato ainda estiver \"Aberta\" no sistema, o app avisa que ele pode mudar.\u003c/div>\n\u003c/section>\n\n\u003c/div>\n\n\u003cdiv style=\"display: flex; align-items: center;
