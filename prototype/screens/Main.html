<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { menuOpen: true, cfgOpen: false, cpOpen: false, saidaOpen: false, printOpen: false, porFolha: 1, planoCop: false, plano: 'Neuro: PAS < 160 e PPC > 60 / DTC hoje / nimodipino dia 7 de 21\nRespiratório: manter PCV / reavaliar TRE em 24 h\nInfecção: cefepime D2 de 7 / aguardar hemoculturas e BAAR 2\nMetabólico: manter NaCl 3% / Na alvo 140-150 / repor K\nNutrição: manter enteral plena', pmode: 'todos', sel: { '04': true }, hospital: null, unidade: null };
  }
  renderVals() {
    const hospital = this.state.hospital ?? this.props.hospital ?? 'Hospital das Couves';
    const unidade = this.state.unidade ?? this.props.unidade ?? 'CTI 1 · Neurológico';
    const leitos = ['01', '02', '03', '04', '05', '16', '17', '18', '19', '20'];
    const vagos = { '19': true };
    const sel = this.state.sel;
    const pm = this.state.pmode;
    const out = {};
    leitos.forEach((b) => {
      out['c' + b] = vagos[b] ? 'pb vago' : (sel[b] ? 'pb on' : 'pb');
      out['a' + b] = !!sel[b];
      out['t' + b] = () => {
        if (vagos[b]) return;
        const n = Object.assign({}, this.state.sel);
        n[b] = !n[b];
        this.setState({ sel: n });
      };
    });
    const ocupados = leitos.filter((b) => !vagos[b]).length;
    const nImp = pm === 'todos' ? ocupados : pm === 'este' ? 1 : leitos.filter((b) => !vagos[b] && sel[b]).length;
    return Object.assign(out, {
      hospital: hospital,
      unidade: unidade,
      menuOpen: this.state.menuOpen,
      cfgOpen: this.state.cfgOpen,
      cpOpen: this.state.cpOpen,
      toggleCp: () => this.setState({ cpOpen: !this.state.cpOpen }),
      saidaOpen: this.state.saidaOpen,
      toggleSaida: () => this.setState({ saidaOpen: !this.state.saidaOpen }),
      toggleMenu: () => this.setState({ menuOpen: !this.state.menuOpen }),
      toggleCfg: () => this.setState({ cfgOpen: !this.state.cfgOpen }),
      onHosp: (e) => this.setState({ hospital: e.target.value }),
      onUnid: (e) => this.setState({ unidade: e.target.value }),
      plano: this.state.plano,
      planoCop: this.state.planoCop,
      onPlano: (e) => this.setState({ plano: e.target.value }),
      copiarPlano: () => this.setState({ planoCop: true, plano: 'Neuro: PAS < 160 e PPC > 60 / nimodipino dia 6 de 21 / DTC amanhã\nRespiratório: manter PCV / sedação mantida\nInfecção: cefepime D1 de 7 / aguardar culturas\nMetabólico: NaCl 3% / Na alvo 140-150\nNutrição: progredir enteral até a meta' }),
      printOpen: this.state.printOpen,
      togglePrint: () => this.setState({ printOpen: !this.state.printOpen }),
      setTodos: () => this.setState({ pmode: 'todos' }),
      setEste: () => this.setState({ pmode: 'este' }),
      setEsc: () => this.setState({ pmode: 'escolher' }),
      clsTodos: pm === 'todos' ? 'po on' : 'po',
      clsEste: pm === 'este' ? 'po on' : 'po',
      clsEsc: pm === 'escolher' ? 'po on' : 'po',
      escolher: pm === 'escolher',
      cls1f: this.state.porFolha === 1 ? 'on' : '',
      cls2f: this.state.porFolha === 2 ? 'on' : '',
      set1f: () => this.setState({ porFolha: 1 }),
      set2f: () => this.setState({ porFolha: 2 }),
      rotImp: nImp === 0 ? 'Marque ao menos um leito' : 'Imprimir ' + nImp + (nImp === 1 ? ' leito' : ' leitos') + ' · ' + Math.ceil(nImp / this.state.porFolha) + (Math.ceil(nImp / this.state.porFolha) === 1 ? ' folha' : ' folhas')
    });
  }
}
DCLite.mount(Component, {"hospital":"Hospital das Couves","unidade":"CTI 1 · Neurológico"});
</script>
