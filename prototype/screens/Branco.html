\"lbl {{semDev}}\">Nenhum dispositivo ainda.\u003c/span>\n\u003csc-for list=\"{{devList}}\" as=\"d\" hint-placeholder-count=\"2\">\n\u003cdiv class=\"dvi\">\u003cspan>{{d.txt}}\u003csc-if value=\"{{d.unk}}\" hint-placeholder-val=\"{{ false }}\">\u003cspan class=\"rtag\">data a conferir\u003c/span>\u003c/sc-if>\u003c/span>\u003cbutton class=\"lnk\" onClick=\"{{d.rm}}\">Retirar\u003c/button>\u003c/div>\n\u003c/sc-for>\n\u003c/div>\n\u003cspan class=\"lbl\">Os dias são contados a partir da data de inserção e acompanham o paciente nos rounds seguintes. Drenos, DVE, SNG em sifonagem e ostomias entram sozinhos nas perdas do balanço, e um dreno retirado hoje continua lá com o débito do período. Sem registro da data, marque “data desconhecida”: o dispositivo fica “a conferir” e vira pendência.\u003c/span>\n\u003c/section>\n\u003c/div>\n\n\u003cdiv class=\"row\">\n\u003csection class=\"card\" style=\"flex: 6 1 440px\">\n\u003cdiv class=\"ch\">\n\u003ch2 class=\"ct\">Hemodinâmica e infusões\u003c/h2>\n\u003cbutton class=\"add\">\u003csvg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\">\u003cpath d=\"M12 5v14M5 12h14\"/>\u003c/svg>Infusão\u003c/button>\n\u003c/div>\n\u003cdiv style=\"overflow-x: auto\">\n\u003ctable class=\"tbl\">\n\u003cthead>\u003ctr>\u003cth>Droga\u003c/th>\u003cth>Concentração final\u003c/th>\u003cth>Vazão (ml/h)\u003c/th>\u003cth>Dose\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003cselect class=\"in\" aria-label=\"Droga\" style=\"min-width: 150px\" value=\"{{droga}}\" onChange=\"{{onDroga}}\">\u003coption>\u003c/option>\u003coption>Noradrenalina\u003c/option>\u003coption>Vasopressina\u003c/option>\u003coption>Dobutamina\u003c/option>\u003coption>Dopamina\u003c/option>\u003coption>Nitroprussiato\u003c/option>\u003coption>Nitroglicerina\u003c/option>\u003coption>Amiodarona\u003c/option>\u003coption>Fen       dn: '', peso: '', droga: '', conc: '', vaz: '', dvt: '', mod: '', p3: '', devs: [], removidos: [], devUnk: false, devErr: '', atbErr: '', deb: {}, atbs: [], atbPrevs: [], atbOpen: true, atbNome: '', atbOut: '', atbD0: '', atbFoco: '', atbPrev: '', dvs: '', dvm: '', dvo: '', dvl: '', devData: '', cirData: '', neuroOn: true, cirOn: false, idosoOn: false, vascOpen: true, fxData: '', fxCir: '',
      g1: '', g2: '', g3: '', p1: '', plano: '',
      devOpen: true, isoOpen: false, dxOpen: false, escOpen: false, profOpen: false, cpOpen: false
    };
  }
  renderVals() {
    const s = this.state;
    const REF = new Date(2026, 9, 28);
    const HORAS = 19 + 20 / 60;
    const dec = (v) => { const t = String(v || '').trim().replace(',', '.'); return /^\d+(\.\d+)?$/.test(t) ? Number(t) : NaN; };
    // Volumes in ml: digits, optional thousands dots (2.100) and decimal comma (1,5).
    const vol = (v) => {
      const t = String(v == null ? '' : v).trim();
      if (t === '') return { st: 'vazio' };
      if (/^[-−]/.test(t)) return { st: 'erro', msg: 'volume negativo' };
      if (/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(t) || /^\d+(,\d+)?$/.test(t)) return { st: 'ok', n: Number(t.replace(/\./g, '').replace(',', '.')) };
      if (/^\d+\.\d{1,2}$/.test(t)) return { st: 'erro', msg: 'use vírgula para decimal (ex.: 1,5)' };
      return { st: 'erro', msg: 'valor inválido' };
    };
    const ok = (n) => typeof n === 'number' && isFinite(n);
    const f = (n, d) => n.toLocaleString('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d });
    const fml = (n) => Math.round(n).toLocaleString('pt-BR');
    const data = (v) => {
      const m = String(v || '').trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
      if (!m) return null;
      const d = new Date(+m[3], +m[2] - 1, +m[1]);
      if (d.getDate() !== +m[1] || d.getMonth() !== +m[2] - 1) return null;
      return d;
    };

    let idade = '';
    let idadeN = null;
    const nasc = data(s.dn);
    if (nasc) {
      let a = REF.getFullYear() - nasc.getFullYear();
      if (REF.getMonth() < nasc.getMonth() || (REF.getMonth() === nasc.getMonth() && REF.getDate() < nasc.getDate())) a -= 1;
      if (a >= 0 && a <= 120) { idade = a + (a === 1 ? ' ano' : ' anos'); idadeN = a; }
    }

    let devDias = '';
    const ins = data(s.devData);
    if (s.devUnk) devDias = 'desconhecida';
    else if (ins) {
      const n = Math.round((REF - ins) / 86400000);
      devDias = n < 0 ? 'data no futuro' : n <= 365 ? 'D' + n : 'mais de 1 ano';
    } else if (String(s.devData || '').trim().length >= 8) devDias = 'data inválida';

    let po = '';
    const cd = data(s.cirData);
    if (cd) {
      const n = Math.round((REF - cd) / 86400000);
      if (n >= 0 && n <= 365) po = 'PO D' + n;
    }

    const dh = (v) => {
      const m = String(v || '').trim().match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{4}))?\s+(\d{1,2}):(\d{2})$/);
      if (!m) return null;
      const y = m[3] ? +m[3] : 2026, mo = +m[2] - 1, dd = +m[1], hr = +m[4], mi = +m[5];
      if (hr > 23 || mi > 59) return null;
      const d = new Date(y, mo, dd, hr, mi);
      return d.getDate() === dd && d.getMonth() === mo ? d : null;
    };
    let fxTempo = '';
    const fx1 = dh(s.fxData), fx2 = dh(s.fxCir);
    if ((String(s.fxData || '').trim() && !fx1) || (String(s.fxCir || '').trim() && !fx2)) fxTempo = 'data ou hora inválida';
    else if (fx1 && fx2) {
      const hh = Math.round((fx2 - fx1) / 3600000);
      fxTempo = hh < 0 ? 'cirurgia antes da fratura?' : hh <= 720 ? hh + ' h' : 'mais de 30 dias';
    }

    const DR = {
      'Noradrenalina': [200, 'mcg/ml', ['mcg/kg/min']], 'Vasopressina': [0.2, 'UI/ml', ['UI/min']],
      'Dobutamina': [12.5, 'mg/ml', ['mcg/kg/min']], 'Dopamina': [5, 'mg/ml', ['mcg/kg/min']],
      'Nitroprussiato': [200, 'mcg/ml', ['mcg/kg/min']], 'Nitroglicerina': [100, 'mcg/ml', ['mcg/kg/min']],
      'Amiodarona': [3.6, 'mg/ml', ['mg/h']], 'Fentanil': [50, 'mcg/ml', ['mcg/h', 'mcg/kg/h']],
      'Morfina': [1, 'mg/ml', ['mg/h', 'mcg/kg/h']], 'Midazolam': [5, 'mg/ml', ['mg/h', 'mg/kg/h']],
      'Propofol': [10, 'mg/ml', ['mcg/kg/min', 'mg/kg/h']], 'Dexmedetomidina': [4, 'mcg/ml', ['mcg/kg/h']],
      'Cisatracúrio': [2, 'mg/ml', ['mcg/kg/min']], 'Rocurônio': [5, 'mg/ml', ['mcg/kg/min']]
    };
    const peso = dec(s.peso);
    const vaz = dec(s.vaz);
    const dr = DR[s.droga] || null;
    const concTxt = s.conc !== '' && s.conc != null ? s.conc : (dr ? String(dr[0]).replace('.', ',') : '');
    const conc = dec(concTxt);
    let dose = '';
    if (dr && ok(vaz) && vaz >= 0 && ok(conc) && conc > 0) {
      const ui = dr[1] === 'UI/ml';
      const mcgH = ui ? 0 : vaz * conc * (dr[1] === 'mg/ml' ? 1000 : 1);
      const temPeso = ok(peso) && peso > 0;
      const parts = dr[2].map((u) => {
        if (u === 'UI/min') return f(vaz * conc / 60, 3) + ' UI/min';
        if (u === 'mg/h') return f(mcgH / 1000, 1) + ' mg/h';
        if (u === 'mcg/h') return f(mcgH, 0) + ' mcg/h';
        if (!temPeso) return null;
        if (u === 'mcg/kg/min') return f(mcgH / 60 / peso, 2) + ' mcg/kg/min';
        if (u === 'mcg/kg/h') return f(mcgH / peso, 2) + ' mcg/kg/h';
        if (u === 'mg/kg/h') return f(mcgH / 1000 / peso, 2) + ' mg/kg/h';
        return null;
      }).filter(Boolean);
      dose = parts.length ? parts.join(' · ') : 'informe o peso';
    }
    let tfg = '';
    {
      const cr = dec(s.cr);
      if (idadeN != null && idadeN >= 18 && ok(cr) && cr > 0 && (s.sexo === 'F' || s.sexo === 'M')) {
        const fem = s.sexo === 'F', k = fem ? 0.7 : 0.9, al = fem ? -0.241 : -0.302, r = cr / k;
        const v = 142 * Math.pow(Math.min(r, 1), al) * Math.pow(Math.max(r, 1), -1.2) * Math.pow(0.9938, idadeN) * (fem ? 1.012 : 1);
        const cl = v >= 90 ? 'G1' : v >= 60 ? 'G2' : v >= 45 ? 'G3a' : v >= 30 ? 'G3b' : v >= 15 ? 'G4' : 'G5';
        tfg = Math.round(v) + ' ml/min/1,73 m² · ' + cl;
      }
    }
    const dvt = s.dvt || '';
    const kind = /^(CVC|CDL)/.test(dvt) ? 'ven' : dvt === 'PICC' ? 'picc' : dvt === 'PAI' ? 'art' : dvt === 'Dreno torácico' ? 'tor'
      : ['Hemovac', 'Dreno de cavidade', 'Dreno tubular/laminar'].includes(dvt) ? 'abd' : dvt === 'DVE' ? 'dve'
      : dvt.startsWith('Outro') ? 'outro' : 'txt';
    const mod = s.mod || '';

    // Fluid balance: every drain counts (also one removed today), a blank field is
    // "not informed" (never zero), and invalid volumes are rejected, not guessed.
    const devs = s.devs || [];
    const DRENOS = ['Hemovac', 'Dreno de cavidade', 'Dreno tubular/laminar', 'Dreno torácico', 'DVE', 'SNG em sifonagem', 'Ostomia'];
    const dv = s.deb || {};
    const drV = devs.filter((d) => DRENOS.includes(d.nome)).map((d) => ({ d: d, fora: false }))
      .concat((s.removidos || []).filter((d) => DRENOS.includes(d.nome)).map((d) => ({ d: d, fora: true })))
      .map((x) => ({ d: x.d, fora: x.fora, r: vol(dv[x.d.id]) }));
    const gV = vol(s.g1), pV = vol(s.p1), hdV = vol(s.p3);
    const falta = [], erro = [];
    const conf = (nome, r, obrig) => { if (r.st === 'erro') erro.push(nome + ': ' + r.msg); else if (r.st === 'vazio' && obrig) falta.push(nome); };
    conf('ganhos', gV, true);
    conf('diurese', pV, true);
    conf('HD (UF)', hdV, false);
    drV.forEach((x) => conf(x.d.nome + (x.d.sitio ? ' ' + x.d.sitio : ''), x.r, true));
    const perdas = [pV, hdV].concat(drV.map((x) => x.r)).filter((r) => r.st === 'ok').map((r) => r.n);
    const totP = perdas.reduce((a, b) => a + b, 0);
    let bh = '', bhSt = '';
    if (gV.st === 'ok') {
      const b = gV.n - totP;
      bh = (b > 0 ? '+' : b < 0 ? '−' : '') + fml(Math.abs(b)) + ' ml';
      if (falta.length) bhSt = 'PARCIAL · falta: ' + falta.join(', ');
      else if (erro.length) bhSt = 'PARCIAL · corrija o valor inválido';
    } else if (perdas.length || gV.st === 'erro') {
      bh = '—';
      bhSt = 'Sem o total de ganhos, o balanço não é calculado.';
    }
    const bhErr = erro.join(' · ');
    const diu = pV.st === 'ok' ? pV.n : NaN;
    let mlkgh = '';
    if (ok(diu) && ok(peso) && peso > 0) mlkgh = '· ' + f(diu / peso / HORAS, 1) + ' ml/kg/h';

    const LOC = { 'Emergência': 'Emergência', 'Centro cirúrgico': 'CC', 'CTI': 'CTI', 'Enfermaria': 'Enfermaria', 'Outro hospital': 'outro hospital' };
    const txtDev = (d) => {
      const dt = data(d.data);
      const n = dt ? Math.round((REF - dt) / 86400000) : null;
      const d0 = dt ? String(dt.getDate()).padStart(2, '0') + '/' + String(dt.getMonth() + 1).padStart(2, '0') : '';
      const loc = d.local ? ' - ' + LOC[d.local] : '';
      const pre = d.unk ? 'D? (D0 desconhecido' + loc + ') ' : n != null && n >= 0 ? 'D' + n + ' (D0 ' + d0 + loc + ') ' : '';
      return pre + d.nome + (d.sitio ? ' ' + d.sitio : '');
    };
    const ATB_R = ['Linezolida', 'Tigeciclina', 'Daptomicina', 'Ceftazidima-avibactam', 'Anfotericina B lipossomal', 'Teicoplanina', 'Polimixina B', 'Aztreonam', 'RHZE', 'Amicacina', 'Ertapenem'];
    const atbs = s.atbs || [];
    const atbPrevs = s.atbPrevs || [];
    const ddmm = (dt) => String(dt.getDate()).padStart(2, '0') + '/' + String(dt.getMonth() + 1).padStart(2, '0');
    const minus = (t) => (t && t !== t.toUpperCase() ? t.charAt(0).toLowerCase() + t.slice(1) : t || '');
    const txtAtb = (a) => {
      const dt = data(a.d0);
      const n = dt ? Math.round((REF - dt) / 86400000) : null;
      const pre = n != null && n >= 0 ? 'D' + n + ' (D0 ' + ddmm(dt) + ') ' : '';
      return pre + minus(a.nome) + (a.foco ? ' · ' + minus(a.foco) : '') + (a.prev ? ' · previsto ' + a.prev + ' dias' : '');
    };
    const susAtb = (i) => () => {
      const l = (this.state.atbs || []).slice();
      const a = l.splice(i, 1)[0];
      if (!a) return;
      const dt = data(a.d0);
      this.setState({ atbs: l, atbPrevs: (this.state.atbPrevs || []).concat([minus(a.nome) + ' (' + (dt ? ddmm(dt) + ' a ' : 'até ') + ddmm(REF) + ')']) });
    };
    // Removing a drain ends it but keeps today's output in the balance.
    const rmDev = (i) => () => {
      const l = (this.state.devs || []).slice();
      const d = l.splice(i, 1)[0];
      if (!d) return;
      const fora = (this.state.removidos || []).concat(DRENOS.includes(d.nome) ? [d] : []);
      this.setState({ devs: l, removidos: fora });
    };
    const setDeb = (d) => (e) => { if (!d) return; this.setState({ deb: Object.assign({}, this.state.deb, { [d.id]: e.target.value }) }); };
    const set = (k) => (e) => this.setState({ [k]: e.target.value });
    const tog = (k) => () => this.setState({ [k]: !this.state[k] });
    const add = (t) => () => { const p = (this.state.plano || '').replace(/\s+$/, ''); this.setState({ plano: (p ? p + '\n' : '') + t + ': ' }); };

    return {
      hospital: this.props.hospital ?? 'Hospital das Couves',
      unidade: this.props.unidade ?? 'CTI 1 · Neurológico',
      dn: s.dn, peso: s.peso, droga: s.droga, concV: concTxt, concU: dr ? dr[1] : '', vaz: s.vaz,
      onDroga: (e) => this.setState({ droga: e.target.value, conc: '' }), onConc: set('conc'),
      dvt: dvt, onDvt: set('dvt'), sVen: kind === 'ven', sArt: kind === 'art', sPicc: kind === 'picc', sTor: kind === 'tor', sAbd: kind === 'abd', sDve: kind === 'dve', sOutro: kind === 'outro', sTxt: kind === 'txt',
      mod: mod, onMod: set('mod'), vPi: mod === 'PCV', vPs: ['PSV', 'CPAP'].includes(mod), vVc: ['', 'VCV', 'PCV', 'PSV'].includes(mod),
      sv: s.sv, onSv: set('sv'), vO2: ['CN', 'Máscara', 'Macronebulização'].includes(s.sv), vCnaf: s.sv === 'CNAF', vMod: !s.sv || ['VNI', 'TOT + VM', 'TQT + VM'].includes(s.sv),
      p3: s.p3, onP3: set('p3'),

      dvs: s.dvs, onDvs: set('dvs'), dvm: s.dvm, onDvm: set('dvm'), dvo: s.dvo, onDvo: set('dvo'), dvl: s.dvl, onDvl: set('dvl'),
      addDev: () => {
        const t = this.state;
        if (!t.dvt) { this.setState({ devErr: 'Escolha o tipo de dispositivo.' }); return; }
        const dt = data(t.devData);
        if (!t.devUnk && !dt) { this.setState({ devErr: 'Informe a data de inserção (dd/mm/aaaa) ou marque “data desconhecida”.' }); return; }
        if (!t.devUnk && dt > REF) { this.setState({ devErr: 'A data de inserção está no futuro.' }); return; }
        const nome = t.dvt.startsWith('Outro') ? (t.dvo || 'Outro') : t.dvt.replace(' (cateter de diálise)', '');
        const d = { id: 'd' + Date.now() + Math.floor(Math.random() * 1000), nome: nome, sitio: [t.dvs, t.dvm].filter(Boolean).join(' '), data: t.devUnk ? '' : t.devData, unk: !!t.devUnk, local: t.dvl || '' };
        this.setState({ devs: (t.devs || []).concat([d]), dvt: '', dvs: '', dvm: '', dvo: '', devData: '', devUnk: false, devErr: '', dvl: '', devOpen: false });
      },
      semDev: devs.length ? 'hid' : '',
      devList: devs.map((d, i) => ({ txt: txtDev(d), unk: !!d.unk, rm: rmDev(i) })),
      devUnk: !!s.devUnk, devErr: s.devErr || '', onDevUnk: (e) => this.setState({ devUnk: e.target.checked, devData: '', devErr: '' }),
      drList: drV.map((x) => ({ nome: x.d.nome + (x.d.sitio ? ' ' + x.d.sitio : ''), sub: (x.fora ? 'retirado hoje · ' : '') + 'ontem: ' + (x.d.ontem || '— (novo)'), val: dv[x.d.id] || '', on: setDeb(x.d) })),
      atbOpen: s.atbOpen, toggleAtb: tog('atbOpen'), atbNome: s.atbNome, onAtbNome: set('atbNome'), atbOut: s.atbOut, onAtbOut: set('atbOut'),
      atbOutro: (s.atbNome || '').startsWith('Outro'), atbD0: s.atbD0, onAtbD0: set('atbD0'), atbFoco: s.atbFoco, onAtbFoco: set('atbFoco'), atbPrev: s.atbPrev, onAtbPrev: set('atbPrev'),
      atbRestrito: ATB_R.includes(s.atbNome),
      addAtb: () => {
        const t = this.state;
        if (!t.atbNome) { this.setState({ atbErr: 'Escolha o antimicrobiano.' }); return; }
        const dt = data(t.atbD0);
        if (!dt) { this.setState({ atbErr: String(t.atbD0 || '').trim() ? 'D0 inválido: use dd/mm/aaaa.' : 'Informe o D0, o dia da 1ª dose.' }); return; }
        if (dt > REF) { this.setState({ atbErr: 'O D0 está no futuro.' }); return; }
        const nome = t.atbNome.startsWith('Outro') ? (t.atbOut || 'outro') : t.atbNome;
        const a = { id: 'a' + Date.now() + Math.floor(Math.random() * 1000), nome: nome, d0: t.atbD0 || '', foco: t.atbFoco || '', prev: t.atbPrev || '' };
        this.setState({ atbs: (t.atbs || []).concat([a]), atbNome: '', atbOut: '', atbD0: '', atbFoco: '', atbPrev: '', atbErr: '', atbOpen: false });
      },
      semAtb: atbs.length ? 'hid' : '', prevC: atbPrevs.length ? '' : 'hid', prevT: atbPrevs.join('; '),
      atbList: atbs.map((a, i) => ({ txt: txtAtb(a), restrito: ATB_R.includes(a.nome), sus: susAtb(i) })), atbErr: s.atbErr || '',
      sexo: s.sexo, onSexo: set('sexo'), cr: s.cr, onCr: set('cr'), tfg: tfg, devData: s.devData,
      g1: s.g1, g2: s.g2, g3: s.g3, p1: s.p1,
      idade: idade, devDias: devDias, dose: dose, po: po, cirData: s.cirData, onCirData: set('cirData'),
      neuroOn: s.neuroOn, neuroOff: !s.neuroOn, toggleNeuro: tog('neuroOn'),
      onNc: (e) => this.setState({ nc: e.target.value }),
      ncData: !!s.nc && !s.nc.startsWith('Não'),
      ncLbl: (s.nc || '').includes('conservadora') ? 'Conservadora desde' : (s.nc || '').startsWith('Alta') ? 'Alta em' : 'Acompanha desde',
      cirOn: s.cirOn, cirOff: !s.cirOn, toggleCir: tog('cirOn'),
      idosoOn: s.idosoOn, idosoOff: !s.idosoOn, toggleIdoso: tog('idosoOn'),
      vascOpen: s.vascOpen, toggleVasc: tog('vascOpen'),
      fxData: s.fxData, fxCir: s.fxCir, onFx: set('fxData'), onFxCir: set('fxCir'), fxTempo: fxTempo,
      totG: gV.st === 'ok' ? fml(gV.n) : '', totP: perdas.length ? fml(totP) : '', bh: bh, bhSt: bhSt, bhErr: bhErr, mlkgh: mlkgh,
      onDn: set('dn'), onPeso: set('peso'), onVaz: set('vaz'), onDevData: set('devData'),
      onG1: set('g1'), onG2: set('g2'), onG3: set('g3'), onP1: set('p1'),
      plano: s.plano, onPlano: set('plano'), tp1: add('Neuro'), tp2: add('Respiratório'), tp3: add('Hemodinâmica'), tp4: add('Infecção'), tp5: add('Metabólico'), tp6: add('Nutrição'),
      isoOpen: s.isoOpen, toggleIso: tog('isoOpen'),
      devOpen: s.devOpen, dxOpen: s.dxOpen, escOpen: s.escOpen, profOpen: s.profOpen, cpOpen: s.cpOpen,
      toggleDev: tog('devOpen'), toggleDx: tog('dxOpen'), toggleEsc: tog('escOpen'), toggleProf: tog('profOpen'), toggleCp: tog('cpOpen')
    };
  }
}
DCLite.mount(Component, {"hospital":"Hospital das Couves","unidade":"CTI 1 · Neurológico"});
